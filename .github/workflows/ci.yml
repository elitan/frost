name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "apps/marketing/**"
      - ".codex/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "apps/marketing/**"
      - ".codex/**"
  schedule:
    # Nightly full run, including the upgrade e2e
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: |
          for attempt in 1 2 3; do
            if bun install --frozen-lockfile; then exit 0; fi
            echo "bun install failed (attempt $attempt/3), retrying..."
            rm -rf node_modules apps/app/node_modules ~/.bun/install/cache
            sleep 2
          done
          echo "bun install failed after 3 attempts"
          exit 1
      - run: bun run typecheck

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: |
          for attempt in 1 2 3; do
            if bun install --frozen-lockfile; then exit 0; fi
            echo "bun install failed (attempt $attempt/3), retrying..."
            rm -rf node_modules apps/app/node_modules ~/.bun/install/cache
            sleep 2
          done
          echo "bun install failed after 3 attempts"
          exit 1
      - run: bun run lint

  migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun run migrations:check

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: |
          for attempt in 1 2 3; do
            if bun install --frozen-lockfile; then exit 0; fi
            echo "bun install failed (attempt $attempt/3), retrying..."
            rm -rf node_modules apps/app/node_modules ~/.bun/install/cache
            sleep 2
          done
          echo "bun install failed after 3 attempts"
          exit 1
      - name: Setup database
        run: bun run migrate
        env:
          NODE_ENV: development
      - run: bun run test

  build:
    runs-on: ubuntu-latest
    needs: [typecheck, lint, migrations, test]
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: |
          for attempt in 1 2 3; do
            if bun install --frozen-lockfile; then exit 0; fi
            echo "bun install failed (attempt $attempt/3), retrying..."
            rm -rf node_modules apps/app/node_modules ~/.bun/install/cache
            sleep 2
          done
          echo "bun install failed after 3 attempts"
          exit 1
      - name: Build
        run: |
          for attempt in 1 2 3; do
            if bun run build; then exit 0; fi
            echo "Build failed (attempt $attempt/3), retrying..."
            rm -rf apps/app/.next
            sleep 2
          done
          echo "Build failed after 3 attempts"
          exit 1

  changes:
    runs-on: ubuntu-latest
    outputs:
      upgrade: ${{ steps.filter.outputs.upgrade }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Detect upgrade-relevant changes
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" = "schedule" ] || [ "$EVENT" = "workflow_dispatch" ]; then
            echo "upgrade=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "$EVENT" = "pull_request" ]; then BASE="$BASE_SHA"; else BASE="$BEFORE"; fi
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "upgrade=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          CHANGED=$(git diff --name-only "$BASE" "$GITHUB_SHA")
          echo "$CHANGED"
          if echo "$CHANGED" | grep -Eq '^(install\.sh|update\.sh|apps/app/schema/|apps/app/src/lib/(migrate|updater|update-|frost-db-)|apps/app/src/server/updates\.ts|apps/app/src/instrumentation\.ts|apps/app/scripts/(e2e-upgrade|e2e-update)|\.github/workflows/(ci|release)\.yml)'; then
            echo "upgrade=true" >> "$GITHUB_OUTPUT"
          else
            echo "upgrade=false" >> "$GITHUB_OUTPUT"
          fi

  # Full e2e on GitHub-hosted runners (free for public repos). The harness
  # treats the runner as the "server" and reaches it over SSH on 127.0.0.1.
  # Real Hetzner servers are only used by e2e-upgrade below.
  e2e-runner:
    needs: [build]
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            os: ubuntu-24.04
          - arch: arm64
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    name: e2e-runner (${{ matrix.arch }})
    steps:
      - uses: actions/checkout@v5

      - name: Prepare runner as a fresh server
        run: |
          sudo systemctl stop apt-daily.service apt-daily-upgrade.service unattended-upgrades.service >/dev/null 2>&1 || true
          sudo apt-get -o DPkg::Lock::Timeout=600 install -y -qq openssh-server >/dev/null
          ssh-keygen -t ed25519 -N "" -f ~/.ssh/id_ed25519 -q
          sudo mkdir -p /root/.ssh
          sudo cp ~/.ssh/id_ed25519.pub /root/.ssh/authorized_keys
          sudo chmod 700 /root/.ssh && sudo chmod 600 /root/.ssh/authorized_keys
          sudo systemctl restart ssh || sudo systemctl restart sshd
          ssh -o StrictHostKeyChecking=no root@127.0.0.1 "echo SSH ready"
          echo "E2E_PUBLIC_IP=$(curl -fsS https://api.ipify.org)" >> "$GITHUB_ENV"

      - name: Install Frost
        id: install
        run: |
          BRANCH="${{ github.head_ref || github.ref_name }}"
          sudo FROST_BIND_HOST=0.0.0.0 bash ./install.sh -b "$BRANCH" --create-api-key 2>&1 | tee /tmp/install-output.txt
          API_KEY=$(sed 's/\x1b\[[0-9;]*m//g' /tmp/install-output.txt | grep "API Key:" | awk '{print $3}')
          if [ -z "$API_KEY" ]; then
            echo "Failed to extract API key"; exit 1
          fi
          echo "::add-mask::$API_KEY"
          echo "api_key=$API_KEY" >> "$GITHUB_OUTPUT"
          sudo bash -c 'git config --global user.email "ci@frost.dev" && git config --global user.name "Frost CI" && git config --global --add safe.directory "*"
            for dir in /opt/frost/apps/app/test/fixtures/*/; do
              if [ ! -d "$dir/.git" ]; then
                cd "$dir" && git init -q -b main && git add -A && git commit -q -m "init"
              fi
            done'

      - name: Setup ZFS branching backend
        run: |
          sudo bash -c '
            set -euo pipefail
            apt-get -o DPkg::Lock::Timeout=600 install -y -qq zfsutils-linux >/dev/null
            modprobe zfs
            POOL_NAME=frostpool
            DATASET_BASE=frost/databases
            MOUNT_BASE=/opt/frost/data/postgres/zfs
            mkdir -p "$MOUNT_BASE"
            truncate -s 8G /opt/frost/data/zfs-loopback.img
            zpool create -f "$POOL_NAME" /opt/frost/data/zfs-loopback.img
            zfs create -p "$POOL_NAME/$DATASET_BASE"
            sed -i "/^FROST_POSTGRES_ZFS_/d" /opt/frost/.env
            {
              echo "FROST_POSTGRES_ZFS_POOL=$POOL_NAME"
              echo "FROST_POSTGRES_ZFS_DATASET_BASE=$DATASET_BASE"
              echo "FROST_POSTGRES_ZFS_MOUNT_BASE=$MOUNT_BASE"
            } >> /opt/frost/.env
            systemctl restart frost
          '

      - name: Wait for Frost
        run: |
          for i in {1..36}; do
            if curl -fsS -o /dev/null http://127.0.0.1:3000/api/health; then
              echo "Frost is ready"; exit 0
            fi
            sleep 5
          done
          sudo journalctl -u frost --no-pager -n 80
          exit 1

      - name: Run E2E tests
        env:
          E2E_BRANCH: ${{ github.head_ref || github.ref_name }}
          E2E_BATCH_SIZE: 4
        run: |
          set -o pipefail
          ./apps/app/scripts/e2e-test.sh 127.0.0.1 "${{ steps.install.outputs.api_key }}" 2>&1 | tee /tmp/e2e-tests.log

      - name: Collect logs on failure
        if: failure()
        run: |
          sudo journalctl -u frost --no-pager -n 500 || true
          sudo journalctl -u caddy --no-pager -n 50 || true
          sudo docker ps -a || true
          free -h; df -h /; uname -a

  e2e-upgrade:
    needs: [build, changes]
    if: needs.changes.outputs.upgrade == 'true'
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            os: ubuntu-24.04
          - arch: arm64
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}

    name: e2e-upgrade (${{ matrix.arch }})

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Get latest release tag
        id: release
        run: |
          TAG=$(gh api repos/${{ github.repository }}/releases/latest --jq '.tag_name' 2>/dev/null || echo "")
          if [ -z "$TAG" ]; then
            echo "No releases found, skipping upgrade test"
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "Latest release: $TAG"
            echo "tag=$TAG" >> $GITHUB_OUTPUT
            echo "skip=false" >> $GITHUB_OUTPUT
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Prepare runner as a fresh server
        if: steps.release.outputs.skip != 'true'
        id: server
        run: |
          sudo systemctl stop apt-daily.service apt-daily-upgrade.service unattended-upgrades.service >/dev/null 2>&1 || true
          sudo apt-get -o DPkg::Lock::Timeout=600 install -y -qq openssh-server >/dev/null
          ssh-keygen -t ed25519 -N "" -f ~/.ssh/id_ed25519 -q
          sudo mkdir -p /root/.ssh
          sudo cp ~/.ssh/id_ed25519.pub /root/.ssh/authorized_keys
          sudo chmod 700 /root/.ssh && sudo chmod 600 /root/.ssh/authorized_keys
          sudo systemctl restart ssh || sudo systemctl restart sshd
          ssh-keyscan -H 127.0.0.1 >> ~/.ssh/known_hosts 2>/dev/null
          ssh root@127.0.0.1 "echo SSH ready"
          echo "ip=127.0.0.1" >> "$GITHUB_OUTPUT"

      - name: Install Frost from latest release
        if: steps.release.outputs.skip != 'true'
        id: install
        run: |
          TAG="${{ steps.release.outputs.tag }}"
          echo "Installing Frost $TAG from source checkout using current install.sh"

          ssh root@${{ steps.server.outputs.ip }} "systemctl stop apt-daily.service apt-daily-upgrade.service unattended-upgrades.service >/dev/null 2>&1 || true"
          scp ./install.sh root@${{ steps.server.outputs.ip }}:/tmp/install.sh

          API_KEY=""
          for attempt in 1 2 3 4; do
            echo "Install attempt $attempt/4"
            ssh -o ServerAliveInterval=30 root@${{ steps.server.outputs.ip }} "chmod +x /tmp/install.sh && echo '${{ secrets.FROST_TEST_PASSWORD }}' | FROST_BIND_HOST=0.0.0.0 /tmp/install.sh -b '$TAG' --create-api-key" 2>&1 | tee /tmp/install-output.txt || true

            API_KEY=$(cat /tmp/install-output.txt | sed 's/\x1b\[[0-9;]*m//g' | grep "API Key:" | awk '{print $3}')
            if [ -n "$API_KEY" ]; then
              break
            fi

            if cat /tmp/install-output.txt | sed 's/\x1b\[[0-9;]*m//g' | grep -Eq "Could not get lock /var/lib/dpkg/lock-frontend|Unable to acquire the dpkg frontend lock|unattended-upgr"; then
              sleep_sec=$((attempt * 10))
              echo "dpkg lock detected, retrying in ${sleep_sec}s..."
              sleep "$sleep_sec"
              continue
            fi

            break
          done

          if [ -z "$API_KEY" ]; then
            echo "Failed to extract API key"
            echo "=== Full install output ==="
            cat /tmp/install-output.txt
            exit 1
          fi

          echo "api_key=$API_KEY" >> $GITHUB_OUTPUT
          echo "API key extracted: ${API_KEY:0:12}..."

      - name: Wait for Frost (pre-upgrade)
        if: steps.release.outputs.skip != 'true'
        run: |
          echo "Waiting for Frost..."
          for i in {1..12}; do
            if curl -s -o /dev/null -w "%{http_code}" "http://${{ steps.server.outputs.ip }}:3000/api/health" | grep -q "200"; then
              echo "Frost is ready!"
              exit 0
            fi
            echo "Attempt $i: Frost not ready..."
            sleep 5
          done
          echo "Frost failed to start"
          ssh root@${{ steps.server.outputs.ip }} "journalctl -u frost --no-pager -n 50" || true
          exit 1

      - name: Create pre-upgrade test data
        if: steps.release.outputs.skip != 'true'
        id: predata
        run: |
          set -o pipefail
          chmod +x ./apps/app/scripts/e2e-upgrade-create.sh
          ./apps/app/scripts/e2e-upgrade-create.sh "${{ steps.server.outputs.ip }}" "${{ steps.install.outputs.api_key }}" 2>&1 | tee /tmp/e2e-create.log

      - name: Upgrade to PR branch
        if: steps.release.outputs.skip != 'true'
        run: |
          set -o pipefail
          chmod +x ./apps/app/scripts/e2e-update-ui.sh
          ./apps/app/scripts/e2e-update-ui.sh \
            "${{ steps.server.outputs.ip }}" \
            "${{ steps.install.outputs.api_key }}" \
            "${{ github.head_ref || github.ref_name }}" \
            "${{ github.repository }}" 2>&1 | tee /tmp/e2e-upgrade.log

      - name: Initialize test fixture git repos
        if: steps.release.outputs.skip != 'true'
        run: |
          ssh root@${{ steps.server.outputs.ip }} 'git config --global user.email "ci@frost.dev" && git config --global user.name "Frost CI" && git config --global --add safe.directory "*"
            for dir in /opt/frost/apps/app/test/fixtures/*/; do
              if [ ! -d "$dir/.git" ]; then
                cd "$dir" && git init -b main && git add -A && git commit -m "init"
              fi
            done'

      - name: Wait for Frost (post-upgrade)
        if: steps.release.outputs.skip != 'true'
        run: |
          echo "Waiting for Frost after upgrade..."
          for i in {1..12}; do
            if curl -s -o /dev/null -w "%{http_code}" "http://${{ steps.server.outputs.ip }}:3000/api/health" | grep -q "200"; then
              echo "Frost is ready!"
              exit 0
            fi
            echo "Attempt $i: Frost not ready..."
            sleep 5
          done
          echo "Frost failed to start after upgrade"
          ssh root@${{ steps.server.outputs.ip }} "journalctl -u frost --no-pager -n 100" || true
          exit 1

      - name: Verify pre-upgrade data survived
        if: steps.release.outputs.skip != 'true'
        run: |
          set -o pipefail
          chmod +x ./apps/app/scripts/e2e-upgrade-verify.sh
          ./apps/app/scripts/e2e-upgrade-verify.sh \
            "${{ steps.server.outputs.ip }}" \
            "${{ steps.install.outputs.api_key }}" \
            "${{ steps.predata.outputs.project_id }}" \
            "${{ steps.predata.outputs.service_id }}" \
            "${{ steps.predata.outputs.deployment_id }}" 2>&1 | tee /tmp/e2e-verify.log

      - name: Run standard E2E tests
        if: steps.release.outputs.skip != 'true'
        run: |
          chmod +x ./apps/app/scripts/e2e-test.sh
          set -o pipefail
          ./apps/app/scripts/e2e-test.sh "${{ steps.server.outputs.ip }}" "${{ steps.install.outputs.api_key }}" 2>&1 | tee /tmp/e2e-tests.log
        env:
          E2E_BRANCH: ${{ github.head_ref || github.ref_name }}
          E2E_GROUPS: 04-update,10-race,20-setup

      - name: Create broken branch for rollback test
        if: steps.release.outputs.skip != 'true'
        id: broken
        run: |
          BROKEN_BRANCH="frost-e2e-broken-${{ github.run_id }}-${{ matrix.arch }}"
          echo "Using local broken branch: $BROKEN_BRANCH"
          echo "branch=$BROKEN_BRANCH" >> $GITHUB_OUTPUT

      - name: Create broken migration branch for rollback test
        if: steps.release.outputs.skip != 'true'
        id: broken_migration
        run: |
          BROKEN_BRANCH="frost-e2e-broken-migration-${{ github.run_id }}-${{ matrix.arch }}"
          echo "Using local broken migration branch: $BROKEN_BRANCH"
          echo "branch=$BROKEN_BRANCH" >> $GITHUB_OUTPUT

      - name: Test rollback on build failure
        if: steps.release.outputs.skip != 'true'
        run: |
          set -o pipefail
          chmod +x ./apps/app/scripts/e2e-update-rollback.sh
          ./apps/app/scripts/e2e-update-rollback.sh \
            "${{ steps.server.outputs.ip }}" \
            "${{ steps.install.outputs.api_key }}" \
            "${{ steps.broken.outputs.branch }}" \
            "${{ github.repository }}" 2>&1 | tee /tmp/e2e-rollback.log

      - name: Test rollback on migration failure
        if: steps.release.outputs.skip != 'true'
        run: |
          set -o pipefail
          chmod +x ./apps/app/scripts/e2e-update-rollback.sh
          ./apps/app/scripts/e2e-update-rollback.sh \
            "${{ steps.server.outputs.ip }}" \
            "${{ steps.install.outputs.api_key }}" \
            "${{ steps.broken_migration.outputs.branch }}" \
            "${{ github.repository }}" \
            migration 2>&1 | tee /tmp/e2e-migration-rollback.log

      - name: Cleanup broken branch
        if: always() && steps.broken.outputs.branch
        run: |
          echo "No remote broken branch to delete: ${{ steps.broken.outputs.branch }}"

      - name: Cleanup broken migration branch
        if: always() && steps.broken_migration.outputs.branch
        run: |
          echo "No remote broken migration branch to delete: ${{ steps.broken_migration.outputs.branch }}"

      - name: Collect logs on failure
        if: failure() && steps.release.outputs.skip != 'true' && steps.server.outputs.ip
        run: |
          echo "=========================================="
          echo "=== LOCAL TEST SCRIPT OUTPUTS ==="
          echo "=========================================="
          for log in /tmp/e2e-*.log; do
            if [ -f "$log" ]; then
              echo ""
              echo "=== $(basename $log) ==="
              cat "$log"
            fi
          done

          echo ""
          echo "=========================================="
          echo "=== REMOTE SERVER LOGS ==="
          echo "=========================================="

          echo ""
          echo "=== Frost logs (last 500 lines) ==="
          ssh root@${{ steps.server.outputs.ip }} "journalctl -u frost --no-pager -n 500" || true

          echo ""
          echo "=== Caddy logs ==="
          ssh root@${{ steps.server.outputs.ip }} "journalctl -u caddy --no-pager -n 50" || true

          echo ""
          echo "=== Docker containers ==="
          ssh root@${{ steps.server.outputs.ip }} "docker ps -a" || true

          echo ""
          echo "=== Update log (if exists) ==="
          ssh root@${{ steps.server.outputs.ip }} "cat /opt/frost/data/.update-log 2>/dev/null" || echo "(no update log)"

          echo ""
          echo "=== Update result (if exists) ==="
          ssh root@${{ steps.server.outputs.ip }} "cat /opt/frost/data/.update-result 2>/dev/null" || echo "(no update result)"

          echo ""
          echo "=== frost-update.service logs ==="
          ssh root@${{ steps.server.outputs.ip }} "journalctl -u frost-update --no-pager -n 300" || true

          echo ""
          echo "=== System resources ==="
          ssh root@${{ steps.server.outputs.ip }} "free -h; echo '---'; df -h /; echo '---'; uname -a" || true

          echo ""
          echo "=== Bun version ==="
          ssh root@${{ steps.server.outputs.ip }} "bun --version" || true

          echo ""
          echo "=== Git state ==="
          ssh root@${{ steps.server.outputs.ip }} "cd /opt/frost && git log --oneline -5 && echo '---' && git status --short" || true

          echo ""
          echo "=== .next cache state ==="
          ssh root@${{ steps.server.outputs.ip }} "ls -la /opt/frost/apps/app/.next/ 2>/dev/null | head -20" || echo "(no .next dir)"
